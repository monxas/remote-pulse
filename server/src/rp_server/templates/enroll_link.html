{% extends "base.html" %}

{% block title %}Generate Enrollment Link - Remote-Pulse{% endblock %}

{% block content %}
<h1>Generate Enrollment Link</h1>

<article>
    <form hx-post="/enroll-link/generate" hx-target="#result" hx-swap="innerHTML">
        <label for="group">
            Group
            <input type="text" name="group" id="group" value="default" required>
        </label>

        <label for="hostname">
            Hostname (optional hint)
            <input type="text" name="hostname" id="hostname" placeholder="e.g. laptop-family">
        </label>

        <label for="ttl_hours">
            TTL (hours)
            <input type="number" name="ttl_hours" id="ttl_hours" value="24" min="1" max="168">
        </label>

        <label for="max_uses">
            Max Uses
            <input type="number" name="max_uses" id="max_uses" value="1" min="1" max="100">
        </label>

        <button type="submit">Generate Link</button>
    </form>
</article>

<div id="result"></div>

<script>
document.body.addEventListener('htmx:afterRequest', function(evt) {
    if (evt.detail.successful) {
        const response = JSON.parse(evt.detail.xhr.response);
        const resultHtml = `
            <article>
                <header><strong>Enrollment Link Generated</strong></header>
                <p><strong>Expires:</strong> ${new Date(response.expires_at).toLocaleString()}</p>
                <p><strong>Unix/macOS:</strong></p>
                <pre><code>${response.magic_url_unix}</code></pre>
                <p><strong>Windows:</strong></p>
                <pre><code>${response.magic_url_windows}</code></pre>
                <p><strong>QR Code:</strong></p>
                <div>${response.qr_code_svg}</div>
            </article>
        `;
        document.getElementById('result').innerHTML = resultHtml;
    }
});
</script>
{% endblock %}
