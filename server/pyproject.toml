[project]
name = "rp-server"
version = "1.0.15"
description = "Remote-Pulse monitoring server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "python-jose[cryptography]>=3.3.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "jinja2>=3.1.0",
    "qrcode[pil]>=7.4.0",
    "pyjwt>=2.9.0",
    "authlib>=1.3.0",          # OIDC client (PocketID)
    "itsdangerous>=2.2.0",     # Starlette SessionMiddleware signing
    "sse-starlette>=2.1.0",    # ADR-0009 Phase 1: SSE for /v1/dash/stream
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    # The Server job runs `uv run ruff check .` but ruff was never a dependency
    # of this project, so it failed with "Failed to spawn: ruff". Pinned for the
    # same reason as the agent: a linter that gates the build is part of it.
    "ruff==0.16.8",
]

# Postgres-real tests (audit log immutability, atomic approval, etc.).
# Only installed in the CI job that boots a real Postgres service.
postgres-tests = [
    "testcontainers[postgres]>=4.7.0",
    "psycopg[binary]>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ship the SvelteKit SPA build output alongside the package. The directory
# is populated by `scripts/build_dashboard.sh` (ADR-0009 Phase 0) prior to
# `hatch build`; in dev / CI it stays empty (only `.gitkeep`) and the
# runtime `StaticFiles` mount no-ops gracefully.
[tool.hatch.build.targets.wheel]
packages = ["src/rp_server"]

[tool.hatch.build.targets.wheel.force-include]
"src/rp_server/static/dash-next" = "rp_server/static/dash-next"

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "alembic.ini",
    "alembic/",
    "config/",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "postgres: tests that need a real Postgres (triggers, ARRAY, JSONB)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Kept identical to agent/pyproject.toml so both Python projects fail (and pass)
# on the same rules. See that file for why the selection is explicit.
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort -- import ordering
    "UP",     # pyupgrade
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie
    "RUF100", # unused noqa directives
]
# Deferred here too, needing review rather than a mechanical fix:
#   B008    18 hits, all FastAPI `Depends()` in defaults -- a framework false
#           positive; would need a per-call allowlist before B could be enabled.
#   DTZ003/DTZ005  naive datetime.utcnow()/now() -- real, but changing them
#           touches stored timestamps, so it needs its own PR.
#   S110, BLE001, TRY004  broad excepts / error typing.

[tool.ruff.lint.per-file-ignores]
# Applied migrations are historical artifacts: they already ran against the
# production database, so they get read but not reflowed.
"alembic/versions/*" = ["E501"]
