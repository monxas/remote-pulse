[project]
name = "rp-server"
version = "1.0.0"
description = "Remote-Pulse monitoring server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "python-jose[cryptography]>=3.3.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "jinja2>=3.1.0",
    "qrcode[pil]>=7.4.0",
    "pyjwt>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

# Postgres-real tests (audit log immutability, atomic approval, etc.).
# Only installed in the CI job that boots a real Postgres service.
postgres-tests = [
    "testcontainers[postgres]>=4.7.0",
    "psycopg[binary]>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "postgres: tests that need a real Postgres (triggers, ARRAY, JSONB)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
