[project]
name = "remote-pulse"
version = "0.1.0"
description = "Remote-Pulse agent for fleet monitoring and management"
authors = [
    {name = "Ramón Kamibayashi", email = "ramonkawa@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "click>=8.1.7",
    "httpx>=0.27.0",
    "psutil>=6.0.0",
    "pydantic>=2.8.0",
    "structlog>=24.4.0",
]

[project.scripts]
rp = "rp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rp"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
