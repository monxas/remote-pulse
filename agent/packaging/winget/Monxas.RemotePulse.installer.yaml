# Installer manifest for Remote-Pulse (winget-pkgs schema 1.6.0)
# Template placeholders replaced by render-manifests.sh / release.yml:
#   {VERSION}       - semver, e.g., "0.1.0"
#   {INSTALLER_URL} - GitHub release asset URL for rp-windows-x64.exe
#   {SHA256}        - lowercase hex SHA256 of the EXE asset
---
PackageIdentifier: Monxas.RemotePulse
PackageVersion: "{VERSION}"
MinimumOSVersion: 10.0.19041.0
Platform:
  - Windows.Desktop
Scope: machine
InstallModes:
  - silent
  - silentWithProgress
ExpectedReturnCodes:
  - InstallerReturnCode: 1
    ReturnResponse: installInProgress
UpgradeBehavior: install
Commands:
  - rp
Protocols:
  - rp
Installers:
  - Architecture: x64
    InstallerType: portable
    InstallerUrl: "{INSTALLER_URL}"
    InstallerSha256: "{SHA256}"
ManifestType: installer
ManifestVersion: 1.6.0
