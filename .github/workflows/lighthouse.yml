name: Lighthouse CI

# ADR-0009 Phase 5 — Lighthouse CI gate (warn-only baseline).
#
# Builds the SvelteKit SPA, serves it with `vite preview`, and runs
# Lighthouse against the main dashboard URLs. Assertions are warn-only
# until the baseline is reviewed and the >=90 perf/a11y/best-practices
# budget is enforced. See `web/lighthouserc.json`.
#
# NOTE: most authenticated routes will redirect to the FastAPI /auth/login
# flow when run unauthenticated, which isn't reachable from `vite preview`.
# Lighthouse still measures the shell, but full-page authed scores require
# a richer integration job (FastAPI + OIDC stub) deferred until budgets
# become hard gates.

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/lighthouse.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22']
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install deps (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Build SPA
        run: npm run build

      - name: Run Lighthouse CI
        run: npx --no-install lhci autorun --config=./lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-node-${{ matrix.node }}
          path: web/.lighthouseci/
          retention-days: 14
          if-no-files-found: warn
