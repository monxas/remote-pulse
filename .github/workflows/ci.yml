name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test-agent:
    name: Agent (Python ${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python }}

      - name: Sync deps
        run: uv sync --all-extras --dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest -v

  lint-and-test-server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: remote_pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync --all-extras --dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Alembic upgrade
        env:
          POSTGRES_URL: postgresql+asyncpg://postgres:testpass@localhost:5432/remote_pulse_test
        run: uv run alembic upgrade head

      - name: Pytest (full suite)
        env:
          POSTGRES_URL: postgresql+asyncpg://postgres:testpass@localhost:5432/remote_pulse_test
        run: uv run pytest -v

      - name: Pytest (Postgres-only — audit log immutability)
        env:
          POSTGRES_URL: postgresql+asyncpg://postgres:testpass@localhost:5432/remote_pulse_test
        run: uv run pytest -v -m postgres

  secrets-scan:
    name: Secrets scan (trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trufflehog full history
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ''
          head: HEAD
          extra_args: --only-verified --fail

  security-scan:
    name: Security analysis (semgrep + bandit + safety)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep security scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/python
        env:
          SEMGREP_RULES: p/security-audit p/owasp-top-ten p/python

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Bandit scan (server)
        working-directory: server
        run: |
          uv python install 3.12
          uv pip install bandit
          uv run bandit -r src/ -ll -f json -o bandit-server.json || true
          uv run bandit -r src/ -ll

      - name: Bandit scan (agent)
        working-directory: agent
        run: |
          uv python install 3.12
          uv pip install bandit
          uv run bandit -r src/ -ll -f json -o bandit-agent.json || true
          uv run bandit -r src/ -ll

      - name: Safety vulnerability check (server)
        working-directory: server
        run: |
          uv sync --all-extras --dev
          uv pip list --format=json | uv run safety check --stdin || true

      - name: Safety vulnerability check (agent)
        working-directory: agent
        run: |
          uv sync --all-extras --dev
          uv pip list --format=json | uv run safety check --stdin || true
