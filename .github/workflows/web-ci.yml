name: Web

# ADR-0009 Phase 0: lint + type-check + unit-test + build the SvelteKit
# dashboard in `web/` whenever its source or the build helper changes.
# Independent from the Python CI in `ci.yml` so a dashboard change can't
# block server releases and vice versa.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/build_dashboard.sh'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/build_dashboard.sh'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build SPA (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22']
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install deps (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Lint (prettier + eslint)
        run: npm run lint

      - name: Type check (svelte-check)
        run: npm run check

      - name: Unit tests (vitest)
        run: npm run test:unit -- --run

      - name: Build
        run: npm run build

      - name: Upload SPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: dash-next-${{ matrix.node }}
          path: web/build/
          retention-days: 14
          if-no-files-found: error
