name: Release

on:
  push:
    tags:
      - "v*"

# F7 fully populates this; F1 stub only.
jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-latest
          - target: macos-x64
            os: macos-13
          - target: macos-arm64
            os: macos-latest
          - target: windows-x64
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Build agent binary (PyInstaller)
        working-directory: agent
        run: |
          uv sync --dev
          uv run pyinstaller --onefile --name rp src/rp/__main__.py
          ls -la dist/

      # SHA256SUMS + cosign signing happen in F8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rp-${{ matrix.target }}
          path: agent/dist/rp*

  # release publishing step deferred to F7-F8
