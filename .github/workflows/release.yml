name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build binary
        working-directory: agent
        run: |
          uv sync --all-extras --dev
          uv run pyinstaller rp.spec --clean --noconfirm
          chmod +x dist/rp
          ./dist/rp version
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rp-linux-x64
          path: agent/dist/rp

  build-linux-arm64:
    name: Build Linux arm64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build binary (emulated)
        working-directory: agent
        run: |
          # Build using QEMU emulation
          docker run --rm --platform linux/arm64 \
            -v $(pwd):/work -w /work \
            python:3.12-slim \
            bash -c "apt-get update -qq && apt-get install -y -qq binutils && \
                     pip install -q uv && \
                     uv sync --all-extras --dev && \
                     uv run pyinstaller rp.spec --clean --noconfirm && \
                     chmod +x dist/rp && \
                     ls -lh dist/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rp-linux-arm64
          path: agent/dist/rp

  build-macos-x64:
    name: Build macOS x64
    runs-on: macos-13
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build binary
        working-directory: agent
        run: |
          uv sync --all-extras --dev
          uv run pyinstaller rp.spec --clean --noconfirm
          chmod +x dist/rp
          ./dist/rp version
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rp-macos-x64
          path: agent/dist/rp

  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build binary
        working-directory: agent
        run: |
          uv sync --all-extras --dev
          uv run pyinstaller rp.spec --clean --noconfirm
          chmod +x dist/rp
          ./dist/rp version
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rp-macos-arm64
          path: agent/dist/rp

  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build binary
        working-directory: agent
        run: |
          uv sync --all-extras --dev
          uv run pyinstaller rp.spec --clean --noconfirm
          dir dist\
          dist\rp.exe version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rp-windows-x64.exe
          path: agent/dist/rp.exe

  sha256sums:
    name: Generate SHA256SUMS
    runs-on: ubuntu-latest
    needs:
      - build-linux-x64
      - build-linux-arm64
      - build-macos-x64
      - build-macos-arm64
      - build-windows-x64
    timeout-minutes: 5
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          # Rename artifacts to include target suffix
          mv rp-linux-x64/rp rp-linux-x64
          mv rp-linux-arm64/rp rp-linux-arm64
          mv rp-macos-x64/rp rp-macos-x64
          mv rp-macos-arm64/rp rp-macos-arm64
          mv rp-windows-x64.exe/rp.exe rp-windows-x64.exe

          # Generate checksums
          sha256sum rp-* > SHA256SUMS
          cat SHA256SUMS

          # Move files back for release
          mkdir -p ../release
          mv rp-* ../release/
          mv SHA256SUMS ../release/

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: release/SHA256SUMS

  cosign-sign:
    name: Cosign sign artifacts
    needs: sha256sums
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare binaries
        run: |
          mkdir -p release
          cp artifacts/rp-linux-x64/rp release/rp-linux-x64
          cp artifacts/rp-linux-arm64/rp release/rp-linux-arm64
          cp artifacts/rp-macos-x64/rp release/rp-macos-x64
          cp artifacts/rp-macos-arm64/rp release/rp-macos-arm64
          cp artifacts/rp-windows-x64.exe/rp.exe release/rp-windows-x64.exe

      - name: Sign all binaries
        env:
          COSIGN_EXPERIMENTAL: 1
        working-directory: release
        run: |
          for binary in rp-*; do
            echo "Signing $binary..."
            cosign sign-blob --yes \
              --bundle "${binary}.sig" \
              "$binary"
          done

      - name: Upload signatures
        uses: actions/upload-artifact@v4
        with:
          name: signatures
          path: release/*.sig

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - sha256sums
      - cosign-sign
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp artifacts/rp-linux-x64/rp release/rp-linux-x64
          cp artifacts/rp-linux-arm64/rp release/rp-linux-arm64
          cp artifacts/rp-macos-x64/rp release/rp-macos-x64
          cp artifacts/rp-macos-arm64/rp release/rp-macos-arm64
          cp artifacts/rp-windows-x64.exe/rp.exe release/rp-windows-x64.exe
          cp artifacts/SHA256SUMS/SHA256SUMS release/SHA256SUMS
          cp artifacts/signatures/*.sig release/ || true
          ls -lh release/

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          # Generate changelog
          if [ -n "$PREV_TAG" ]; then
            echo "## Changes since $PREV_TAG" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log --pretty=format:"- %s (%h)" $PREV_TAG..HEAD >> CHANGELOG.md
          else
            echo "## Initial Release" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "First public release of Remote-Pulse agent." >> CHANGELOG.md
          fi

          cat CHANGELOG.md

      - name: Determine prerelease flag
        id: prerelease
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if echo "$TAG" | grep -qE '(alpha|beta|rc)'; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            release/rp-linux-x64
            release/rp-linux-arm64
            release/rp-macos-x64
            release/rp-macos-arm64
            release/rp-windows-x64.exe
            release/SHA256SUMS
            release/*.sig
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          draft: false

  submit-winget:
    name: Submit to winget-pkgs
    runs-on: ubuntu-latest
    needs:
      - build-windows-x64
      - sha256sums
      - release
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: rp-windows-x64.exe
          path: dist/

      - name: Download SHA256SUMS
        uses: actions/download-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/

      - name: Extract version, URL, SHA256
        id: meta
        run: |
          set -eu
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Prefer the canonical SHA from SHA256SUMS, fall back to recompute.
          if [ -f dist/SHA256SUMS ]; then
            SHA256=$(grep 'rp-windows-x64.exe$' dist/SHA256SUMS | awk '{print $1}')
          fi
          if [ -z "${SHA256:-}" ]; then
            SHA256=$(sha256sum dist/rp.exe | awk '{print $1}')
          fi
          URL="https://github.com/monxas/remote-pulse/releases/download/v${VERSION}/rp-windows-x64.exe"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256"  >> "$GITHUB_OUTPUT"
          echo "url=$URL"        >> "$GITHUB_OUTPUT"

      - name: Render manifests
        run: |
          set -eu
          cd agent/packaging/winget
          chmod +x render-manifests.sh
          ./render-manifests.sh \
            "${{ steps.meta.outputs.version }}" \
            "${{ steps.meta.outputs.url }}" \
            "${{ steps.meta.outputs.sha256 }}" \
            "$RUNNER_TEMP/manifests"
          echo "--- Rendered manifests ---"
          for f in "$RUNNER_TEMP"/manifests/*.yaml; do
            echo "### $f"
            cat "$f"
          done

      - name: Lint rendered manifests
        run: |
          python3 -m pip install --quiet --user pyyaml yamllint
          python3 -m yamllint \
            -d '{extends: default, rules: {line-length: {max: 200}, document-start: enable, truthy: {check-keys: false}}}' \
            "$RUNNER_TEMP/manifests/"
          python3 -c "
          import yaml, pathlib, sys
          for p in sorted(pathlib.Path('$RUNNER_TEMP/manifests').glob('*.yaml')):
              data = yaml.safe_load(p.read_text())
              assert data['PackageIdentifier'] == 'Monxas.RemotePulse', p
              assert data['ManifestVersion'] == '1.6.0', p
              print('OK', p.name)
          "

      - name: Upload manifests artifact
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: ${{ runner.temp }}/manifests/

      - name: Submit PR to microsoft/winget-pkgs
        # Automation runs but is non-authoritative until v0.2.0; first
        # release goes through manual submission per agent/packaging/winget/README.md.
        if: ${{ env.WINGET_TOKEN != '' }}
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: Monxas.RemotePulse
          version: ${{ steps.meta.outputs.version }}
          installers-regex: 'rp-windows-x64\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
          max-versions-to-keep: 5
        continue-on-error: true
